version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: deadoralive-postgres
    environment:
      POSTGRES_USER: deadoralive
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deadoralive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: deadoralive-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
